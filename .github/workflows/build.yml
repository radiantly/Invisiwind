name: Build App

on: [push]

jobs:
  build32:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build project
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc

      - name: Rename x86 binary
        shell: powershell
        run: Rename-Item -Path .\target\i686-pc-windows-msvc\release\Invisiwind.exe -NewName Invisiwind32.exe

      - uses: actions/upload-artifact@v7
        with:
          name: x86-binaries
          path: target/i686-pc-windows-msvc/release/Invisiwind32.exe
          if-no-files-found: error

  build64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build project
        run: cargo build --release

      - name: Rename x64 binary
        shell: powershell
        run: Rename-Item -Path .\target\release\Invisiwind.exe -NewName Invisiwind64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: x64-binaries
          path: target/release/Invisiwind64.exe
          if-no-files-found: error

  release:
    runs-on: windows-latest
    needs: [build64, build32]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-binaries"
          path: dist
          merge-multiple: true

      - name: Generate zip bundle
        run: 7z a -tzip Invisiwind.zip .\hide.ahk .\dist\*.exe

      - name: Install InnoSetup
        shell: cmd
        run: choco upgrade innosetup -y --no-progress

      - name: Build Installer
        run: iscc .\Misc\inno.iss

      - name: Publish latest pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          prerelease: true
          generate_release_notes: true
          files: |
            Invisiwind.zip
            Misc/Output/InvisiwindInstaller.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          generate_release_notes: true
          files: |
            Invisiwind.zip
            Misc/Output/InvisiwindInstaller.exe
